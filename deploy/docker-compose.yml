# Compose / Podman specification for internal deployment
# Enforces outbound blocking, non-root execution, and isolated internal networks.

name: intranet-assistant

services:
  reverse-proxy:
    image: nginx:1.27.2-alpine
    pull_policy: never
    container_name: intranet-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - egress_allowed
      - internal_app
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      app:
        condition: service_healthy

  app:
    image: ${APP_IMAGE:-intranet-assistant-app:1.0.0}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: intranet-assistant-app
    restart: unless-stopped
    command: ["--workers", "${WEB_CONCURRENCY:-2}"]
    environment:
      - APP_ENV=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - SECRET_KEY=${SECRET_KEY}
      - ENABLE_DEVELOPMENT_AUTH=false
      - AUTH_MODE=${AUTH_MODE:-local}
      - AUTH_AUDIENCE=enterprise-intranet-assistant
      - AUTH_DB_PATH=/data/auth/auth.sqlite3
      - PASSWORD_HASH_ITERATIONS=${PASSWORD_HASH_ITERATIONS:-600000}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL}
      - ROLE_PERMISSION_MAP=${ROLE_PERMISSION_MAP}
      - AUDIT_LOG_PATH=/var/log/app/audit.jsonl
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["https://intranet-staging.company.internal"]}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./sample_db.sqlite3}
      - DATABASE_READ_ONLY=true
      - LLM_ENABLED=${LLM_ENABLED:-true}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_ALLOWED_HOSTS=${LLM_ALLOWED_HOSTS:-["host.docker.internal"]}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:3b}
      - LLM_INTERNAL_ONLY=true
      - DOCUMENT_ROOTS=["/app/sample_docs"]
      - APPROVERS_CONFIG_FILE=/etc/intranet-assistant/authorized_approvers.json
    volumes:
      - audit_data:/var/log/app
      - ${APPROVERS_CONFIG_HOST_PATH:-./authorized_approvers.json}:/etc/intranet-assistant/authorized_approvers.json:ro
    networks:
      - internal_app
      - egress_allowed
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  llm-service:
    profiles: ["mock-llm"]
    # Staged internal inference engine (vLLM / llama.cpp server)
    # Never downloads models at startup; model weights are mounted read-only.
    image: ${INTERNAL_REGISTRY:-internal-registry.local}/vllm-openai:v0.6.3
    pull_policy: never
    container_name: intranet-llm-service
    restart: unless-stopped
    command: >
      --model /models/${LLM_MODEL:-qwen2.5:1.5b}
      --served-model-name ${LLM_MODEL:-qwen2.5:1.5b}
      --host 0.0.0.0
      --port 8000
      --max-model-len 4096
      --max-num-seqs 2
      --disable-log-requests
    volumes:
      - ${INTERNAL_MODEL_PATH:-./models}:/models:ro
    networks:
      - isolated_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  # Network connected to reverse proxy for incoming requests
  egress_allowed:
    driver: bridge
  # Internal network between proxy and FastAPI app
  internal_app:
    driver: bridge
    internal: true
  # Strictly air-gapped network between FastAPI and inference server.
  # "internal: true" blocks all default routing to the external internet.
  isolated_backend:
    driver: bridge
    internal: true

volumes:
  audit_data:
  auth_data:
