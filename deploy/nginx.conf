# Reverse Proxy configuration for internal TLS termination and edge controls

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_x_request_id":"$http_x_request_id"'
    '}';

    access_log /var/log/nginx/access.log main_json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Edge rate limiting zones
    # General navigation, static assets, and read APIs for 50-100 users sharing corporate egress NAT IP:
    limit_req_zone $binary_remote_addr zone=general_api_zone:10m rate=100r/s;
    # Login & credential protection against brute-force / password spraying:
    limit_req_zone $binary_remote_addr zone=auth_login_zone:10m rate=5r/s;
    # Chat edge limit preventing abusive flood of LLM requests:
    limit_req_zone $binary_remote_addr zone=chat_edge_zone:10m rate=15r/s;
    limit_req_status 429;

    # Global concurrent active chat connection limit across all clients and workers:
    # Protects shared inference capacity (2 active + 10 queue buffer = 12 total capacity ceiling)
    limit_conn_zone $server_name zone=chat_global_conn_zone:10m;
    limit_conn_status 429;

    upstream assistant_backend {
        server app:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Internal TLS Server
    server {
        listen 443 ssl http2;
        server_name _;

        # Internal organization certificates
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Strict Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self';" always;

        client_max_body_size 10M;

        # Authentication endpoints: strictly rate limited against credential stuffing
        location ~ ^/api/v1/auth/(login|token)$ {
            limit_req zone=auth_login_zone burst=10 nodelay;

            proxy_pass http://assistant_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Chat endpoint: edge throttled to protect LLM queue against flood attacks
        location /api/v1/chat {
            limit_req zone=chat_edge_zone burst=25 nodelay;
            limit_conn chat_global_conn_zone 12;

            proxy_pass http://assistant_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # General application traffic (portal navigation, static files, read APIs)
        location / {
            limit_req zone=general_api_zone burst=150 nodelay;

            proxy_pass http://assistant_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass request and correlation IDs through to backend
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Health checks bypass rate limiting
        location /health/ {
            proxy_pass http://assistant_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
